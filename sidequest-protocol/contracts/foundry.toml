[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = true
fuzz.runs = 256
fuzz.max_test_rejects = 65536
block_gas_limit = 30000000

[profile.ci]
fuzz.runs = 1000

# ─── Chain RPC URLs ─────────────────────────────────────────────────────────
# Robinhood Chain Testnet (chainid 46630)
[rpc_endpoints]
rhTestnet = "${RH_TESTNET_RPC_URL}"
rhMainnet = "${RH_MAINNET_RPC_URL}"

# ─── Explorer Verification ──────────────────────────────────────────────────
# Robinhood Chain uses Blockscout-compatible explorers; API key in env.
[etherscan]
rhTestnet = { key = "${RH_EXPLORER_API_KEY}", url = "${RH_EXPLORER_URL}" }
rhMainnet = { key = "${RH_EXPLORER_API_KEY}", url = "${RH_EXPLORER_URL}" }
