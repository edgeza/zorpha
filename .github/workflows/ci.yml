name: CI

# Named as gap 5 in docs/LAUNCH-RUNBOOK.md: "No CI. Every finding in the audit
# except the compile errors would have been caught by a job running
# forge build && forge test on push."
#
# Worth being precise about what this does and does not buy. The five blockers
# found on 2026-09-02 were logic bugs behind tests that could not fail, and no
# CI job would have caught any of them. What it protects is the 215 tests that
# now exist: it stops a regression reaching main, and it stops a branch being
# merged while red. That is the whole claim.

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidequest-protocol/contracts
    steps:
      - uses: actions/checkout@v4

      # Dependencies are committed under contracts/lib rather than being git
      # submodules, so there is no `forge install` step and no submodule
      # checkout to get wrong.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # The invariant suites are the slow part and the most likely to be
      # skipped by hand, which is exactly why they belong here.
      - name: Test (invariants included, explicit)
        run: forge test --match-path 'test/invariants/*' -vvv

  web:
    name: web (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zorpha-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zorpha-web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `prebuild` runs scripts/check-tokenomics.mjs, so this also asserts the
      # published supply numbers still agree with lib/tokenomics.ts.
      - name: Build
        run: npm run build
        env:
          # A build must not depend on secrets being present. If it does, that
          # is the finding.
          NEXT_TELEMETRY_DISABLED: "1"

  indexer:
    name: indexer (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidequest-protocol/indexer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidequest-protocol/indexer/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  gates:
    name: launch gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A merge conflict was committed into components/marketing/Hero.tsx on
      # 2026-09-02 and broke the whole marketing site until it was noticed by
      # hand. Vendored dependencies are excluded; they are not ours to police.
      - name: No committed merge conflict markers
        run: |
          if git grep -In -E '^(<<<<<<<|>>>>>>>) ' -- . ':!*/lib/*' ; then
            echo "::error::merge conflict markers are committed"
            exit 1
          fi
          echo "clean"

# Deliberately NOT here: a burned-key check.
#
# The real one, sidequest-protocol/contracts/script/check-burned-keys.sh, asks
# the chain whether either burned address still holds a role, ownership or
# signing authority. It needs `cast`, an RPC and zorpha-web/.env.local -- and
# that file is gitignored, so the check cannot run in CI at all. It has to be
# run by hand against each deployment.
#
# I first wrote a source-level grep as a stand-in. It was worse than nothing.
# The actual risk surface is .env.local, which is gitignored and therefore
# unreachable by any grep of committed files, so the check had almost nothing
# real to find -- while matching three legitimate places those addresses
# correctly appear: docs/BURNED-KEYS.md itself, docs/TESTNET-GUIDE.md, and a row
# in data/snapshot-testnet.csv where the deployer is an airdrop recipient.
#
# A gate that fires on correct content gets switched off within a day, and then
# you have neither the gate nor the habit. Better to leave the on-chain check as
# a named manual step in the launch checklist than to fake it here.
