name: web

# Split from a single ci.yml so each job carries its own `paths:` filter.
#
# Everything here ran on every pull request regardless of what changed. On the
# seven PRs merged on 5 September, ALL of them web-only, `contracts (forge)`
# ran seven times and tested not one changed line, roughly eighty minutes of a
# paid runner spent on code nobody had edited. That is what exhausted the
# Actions allowance at the time.
#
# The repository is public now, so standard runners are free and that allowance
# no longer applies. The filters stay because the reason for them outlived the
# bill: a red check should mean the change under review broke something, and a
# suite that keeps rerunning untouched code teaches you to skim past it.
#
# GitHub evaluates `paths:` per workflow file, not per job, which is the only
# reason this is four files instead of one. The alternative, a change-detection
# job gating the others with `if:`, keeps one file but pays a checkout on every
# run to work out that it has nothing to do.
#
# A filtered-out job shows no check at all rather than a passing one, and a
# required context that never appears blocks the merge forever. So anything
# branch protection requires has to come from a workflow with no `paths:`
# filter. `gates` is the only one.
#
# NOTE: this job is the only thing that typechecks, lints, tests and builds
# the web app. This note used to say Vercel covered typecheck and build, so
# the job existed mainly for `npm run lint`. That was true while the Vercel
# integration was connected. It is not connected now, the repository has no
# webhooks at all, and the vercel check suite sits queued with zero check runs
# on every commit. Verify that has been restored before deciding this job is
# redundant, because at the moment cutting it would leave zorpha-web with no
# build on any pull request.
#
# `prebuild` runs check-env, check-tokenomics and check-contrast, so a green
# build here also asserts the published supply figures still agree with
# lib/tokenomics.ts and that no colour pair has fallen below its contrast
# floor.

on:
  push:
    branches: [main]
    paths:
      - 'zorpha-web/**'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'zorpha-web/**'
      - '.github/workflows/web.yml'
  # Runnable on demand. The paths filter above means this almost never
  # fires by itself, so without this there is no way to run it against
  # main other than pushing an empty commit that touches the filter.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zorpha-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: zorpha-web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `npm test` predates this workflow and was never wired into it, so the
      # APY arithmetic the portal renders was reaching production with its
      # tests run only on a developer's machine.
      - name: Test
        run: npm test

      # `prebuild` runs scripts/check-tokenomics.mjs, so this also asserts the
      # published supply numbers still agree with lib/tokenomics.ts.
      - name: Build
        run: npm run build
        env:
          # A build must not depend on secrets being present. If it does, that
          # is the finding.
          NEXT_TELEMETRY_DISABLED: "1"
