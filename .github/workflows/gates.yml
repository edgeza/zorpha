name: gates

# Split from a single ci.yml so each job carries its own `paths:` filter.
#
# Everything here ran on every pull request regardless of what changed. On the
# seven PRs merged on 5 September, ALL of them web-only, `contracts (forge)`
# ran seven times and tested not one changed line, roughly eighty minutes of a
# paid runner spent on code nobody had edited. That is what exhausted the
# Actions allowance at the time.
#
# The repository is public now, so standard runners are free and that allowance
# no longer applies. The filters stay because the reason for them outlived the
# bill: a red check should mean the change under review broke something, and a
# suite that keeps rerunning untouched code teaches you to skim past it.
#
# GitHub evaluates `paths:` per workflow file, not per job, which is the only
# reason this is four files instead of one. The alternative, a change-detection
# job gating the others with `if:`, keeps one file but pays a checkout on every
# run to work out that it has nothing to do.
#
# A filtered-out job shows no check at all rather than a passing one, and a
# required context that never appears blocks the merge forever. So anything
# branch protection requires has to come from a workflow with no `paths:`
# filter. `gates` is the only one.
#
# Unfiltered on purpose: it greps the whole tree for conflict markers and takes
# about five seconds. Filtering it would save nothing and could miss a marker
# committed in a directory no other filter covers.

on:
  push:
    branches: [main]
  pull_request:
  # Runnable on demand. The gates are the cheapest job here and the one
  # most often wanted without a commit to hang it on.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: launch gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A merge conflict was committed into components/marketing/Hero.tsx on
      # 2026-09-02 and broke the whole marketing site until it was noticed by
      # hand. Vendored dependencies are excluded; they are not ours to police.
      #
      # That exclusion was `:!*/lib/*`, which also skipped zorpha-web/lib and
      # contracts/src/lib. Both are first-party, so a conflict marker committed
      # in either was invisible to the only check looking for one. Narrowed to
      # the single directory that actually holds vendored code.
      - name: No committed merge conflict markers
        run: |
          if git grep -In -E '^(<<<<<<<|>>>>>>>) ' -- . ':!sidequest-protocol/contracts/lib' ; then
            echo "::error::merge conflict markers are committed"
            exit 1
          fi
          echo "clean"

      # The repository went public on 6 September and a punctuation pass took
      # every em-dash out of first-party prose that morning. Two were back the
      # same afternoon, in a pull request merged a few hours later, because
      # nothing was watching. A one-time cleanup with no ratchet behind it only
      # decays.
      #
      # An em-dash alone inside quotes is deliberate: lib/format.ts returns it
      # as the placeholder for an empty value and its tests assert on that. So
      # the pattern permits an em-dash that is the entire quoted string and
      # rejects it everywhere else. Written as a PCRE escape rather than the
      # character itself, so this file does not trip its own check.
      #
      # The exit status is read in three ways rather than two. `git grep` returns
      # 0 for a match, 1 for none, and something else when it could not run at
      # all, and `-P` is the one flag here that a git build can lack. Written as
      # a plain `if`, a git without PCRE exits 128, the `if` reads that as "no
      # match", and the step passes green having tested nothing. That is a bad
      # failure for any check and a worse one for a required check, because the
      # first sign of it would be an em-dash reaching a public repository.
      - name: No em-dashes in prose
        run: |
          found=$(git grep -nP "(?<!')\x{2014}(?!')" -- . ':!sidequest-protocol/contracts/lib') && rc=0 || rc=$?
          case "$rc" in
            0)
              printf '%s\n' "$found"
              echo "::error::em-dash found: use a comma, semicolon, colon or parentheses"
              exit 1
              ;;
            1)
              echo "clean"
              ;;
            *)
              echo "::error::git grep exited $rc, so this check did not run. Does this git have PCRE?"
              exit 1
              ;;
          esac
