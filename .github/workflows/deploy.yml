name: production

# Checks that production actually followed main. It does not deploy.
#
# Why this exists: on 6 September the repository was deleted and recreated,
# which gave it a new numeric id. Vercel matches incoming git events by that
# id, and its stored binding still pointed at the old one. The project page
# went on showing a healthy `edgeza/zorpha` link the whole time, so nothing
# anywhere reported a problem. Four merges landed on main, every check went
# green, and production served the 09:00 build for three hours.
#
# The failure was silent in the way that matters: not one signal turned red.
# CI passed, pull requests merged clean, the dashboard looked connected. The
# only way to notice was to fetch the live page and compare it against what
# had been merged.
#
# WHY THIS WATCHES INSTEAD OF DEPLOYING
#
# The first version of this file ran `vercel pull`, `build` and `deploy`, on
# the reasoning that a deploy which does not happen should be a red job. That
# was written while the git integration was broken. Once it was repaired,
# Vercel deploys every push to main on its own, so deploying here as well
# would publish each commit twice, with two runs racing for the same
# production alias, and would need a long lived Vercel token in the
# repository to do it.
#
# The fault was never that deploying was hard. It was that NOT deploying was
# invisible. Watching restores exactly that missing signal and nothing else:
# no second deploy, no token, and Vercel's pull request previews keep working.
#
# HOW IT KNOWS
#
# Vercel records a GitHub Deployment against the commit, environment
# `Production`, author `vercel[bot]`. That record is the thing that was
# missing during the outage: across the four merges that served stale content,
# the only deployments on those commits came from railway-app[bot], and there
# was no Vercel entry at all. So requiring one to appear, and to reach
# `success`, would have turned this job red on every one of them.
#
# Reading it needs only the built in GITHUB_TOKEN, which is why no secret is
# configured for this workflow.
#
# `push: branches: [main]` with no `paths:` filter on purpose. Every commit
# that reaches main is expected to reach production, whatever it touched.

on:
  push:
    branches: [main]
  # Runnable on demand, so a suspected stall can be rechecked without pushing
  # an empty commit.
  workflow_dispatch:

# One watcher at a time per ref. Superseded runs are worthless here, because a
# newer commit means a newer deployment to wait for.
concurrency:
  group: production-watch-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  production:
    name: production follows main
    runs-on: ubuntu-latest
    # A fork has no Vercel project behind it, so this would wait twelve
    # minutes and then fail for a reason that is not the fork's problem.
    if: ${{ github.repository == 'edgeza/zorpha' }}
    steps:
      - name: Wait for Vercel to publish this commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          # Twelve minutes. A cold build of this site takes about two, so this
          # is generous enough that a slow queue is not reported as an outage,
          # and short enough to still be reading the merge that caused it.
          for i in $(seq 1 48); do
            id=$(gh api "repos/$REPO/deployments?sha=$SHA&environment=Production" \
                   --jq '.[0].id // empty' 2>/dev/null || true)
            if [ -n "$id" ]; then
              state=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].state // empty' 2>/dev/null || true)
              url=$(gh api "repos/$REPO/deployments/$id/statuses" --jq '.[0].environment_url // empty' 2>/dev/null || true)
              case "$state" in
                success)
                  echo "url=$url" >> "$GITHUB_OUTPUT"
                  echo "Vercel published $SHA to production: ${url:-no url reported}"
                  exit 0
                  ;;
                failure|error)
                  echo "::error::Vercel's production deploy for $SHA reported '$state'. Check the deployment log in the Vercel dashboard."
                  exit 1
                  ;;
              esac
            fi
            [ $((i % 8)) -eq 0 ] && echo "still waiting after $((i * 15))s (deployment: ${id:-none yet}, state: ${state:-none})"
            sleep 15
          done
          echo "::error::No successful Vercel production deployment for $SHA after 12 minutes."
          echo "Vercel did not publish this commit. The usual cause is the project's git"
          echo "connection: it binds to the GitHub repository's NUMERIC id, so deleting and"
          echo "recreating the repository silently breaks it while the dashboard still shows"
          echo "a healthy link. Check Settings > Git on the Vercel project."
          exit 1

      # A published deployment means Vercel finished, not that the domain
      # serves it. The alias is a separate step on Vercel's side and is what
      # a visitor actually reaches, so it gets checked separately.
      - name: Check the live domain answers
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://www.zorpha.xyz/ || true)
            if [ "$code" = "200" ]; then
              echo "https://www.zorpha.xyz/ -> 200"
              exit 0
            fi
            echo "attempt $i: HTTP ${code:-no response}"
            sleep 10
          done
          echo "::error::www.zorpha.xyz did not return 200, although Vercel reports this commit as published."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Production"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- deployment: ${{ steps.deployment.outputs.url || 'not published' }}"
            echo "- live: https://www.zorpha.xyz/"
          } >> "$GITHUB_STEP_SUMMARY"
