name: contracts

# Split from a single ci.yml so each job carries its own `paths:` filter.
#
# Everything here ran on every pull request regardless of what changed. On the
# seven PRs merged on 5 September, ALL of them web-only, `contracts (forge)`
# ran seven times and tested not one changed line, roughly eighty minutes of a
# paid runner spent on code nobody had edited. That is what exhausted the
# Actions allowance at the time.
#
# The repository is public now, so standard runners are free and that allowance
# no longer applies. The filters stay because the reason for them outlived the
# bill: a red check should mean the change under review broke something, and a
# suite that keeps rerunning untouched code teaches you to skim past it.
#
# GitHub evaluates `paths:` per workflow file, not per job, which is the only
# reason this is four files instead of one. The alternative, a change-detection
# job gating the others with `if:`, keeps one file but pays a checkout on every
# run to work out that it has nothing to do.
#
# A filtered-out job shows no check at all rather than a passing one, and a
# required context that never appears blocks the merge forever. So anything
# branch protection requires has to come from a workflow with no `paths:`
# filter. `gates` is the only one.

on:
  push:
    branches: [main]
    paths:
      - 'sidequest-protocol/contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'sidequest-protocol/contracts/**'
      - '.github/workflows/contracts.yml'
  # Runnable on demand. The paths filter above means this almost never
  # fires by itself, so without this there is no way to run it against
  # main other than pushing an empty commit that touches the filter.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts (forge)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidequest-protocol/contracts
    steps:
      - uses: actions/checkout@v4

      # Dependencies are committed under contracts/lib rather than being git
      # submodules, so there is no `forge install` step and no submodule
      # checkout to get wrong.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # The invariant suites are the slow part and the most likely to be
      # skipped by hand, which is exactly why they belong here.
      - name: Test (invariants included, explicit)
        run: forge test --match-path 'test/invariants/*' -vvv

# Deliberately NOT here: a burned-key check.
#
# The real one, sidequest-protocol/contracts/script/check-burned-keys.sh, asks
# the chain whether either burned address still holds a role, ownership or
# signing authority. It needs `cast`, an RPC and zorpha-web/.env.local -- and
# that file is gitignored, so the check cannot run in CI at all. It has to be
# run by hand against each deployment.
#
# I first wrote a source-level grep as a stand-in. It was worse than nothing.
# The actual risk surface is .env.local, which is gitignored and therefore
# unreachable by any grep of committed files, so the check had almost nothing
# real to find -- while matching three legitimate places those addresses
# correctly appear: docs/BURNED-KEYS.md itself, docs/TESTNET-GUIDE.md, and a row
# in data/snapshot-testnet.csv where the deployer is an airdrop recipient.
#
# A gate that fires on correct content gets switched off within a day, and then
# you have neither the gate nor the habit. Better to leave the on-chain check as
# a named manual step in the launch checklist than to fake it here.
